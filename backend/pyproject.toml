[project]
name = "smart-expense-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for Smart Expense Tracker"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "anyio>=4.4.0,<4.10.0",
    "email-validator>=2.1.0",
    "fastapi==0.115.6",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "starlette==0.41.3",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
smart-expense-migrate = "app.scripts.migrate_sqlite:main"
smart-expense-seed = "app.scripts.seed_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
